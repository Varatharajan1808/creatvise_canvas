name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:formats
      - run: npm run test:folder
      - run: npm run test:ai
      - run: npm run test:ai:shapes
      - run: npm run test:psd
      - run: npm run build
